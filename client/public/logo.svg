<svg width="210" height="40" viewBox="0 0 210 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient matching Get Started Button (#06B6D4 to #0284C7 to #2563EB) -->
    <linearGradient id="btn_brand_grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="text_ugc_grad" x1="110" y1="10" x2="200" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="icon_inner_stroke" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="subtle_glow" x="-2" y="-2" width="40" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Logo Mark Icon -->
  <g transform="translate(2, 2)">
    <!-- Outer Glow Rounded Box -->
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#btn_brand_grad)" filter="url(#subtle_glow)"/>
    <!-- Inner Lens -->
    <circle cx="18" cy="18" r="10" fill="#04131E" fill-opacity="0.65" stroke="url(#icon_inner_stroke)" stroke-width="1.5"/>
    <!-- Star Sparkle -->
    <path d="M18 10L19.5 15.5L25 18L19.5 20.5L18 26L16.5 20.5L11 18L16.5 15.5L18 10Z" fill="#FFFFFF"/>
    <!-- Center Core Glow -->
    <circle cx="18" cy="18" r="2.5" fill="#22D3EE"/>
  </g>

  <!-- Clean Typography: "Create UGC Ads" -->
  <text x="48" y="26" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="-0.2">
    <tspan fill="#FFFFFF">Create </tspan><tspan fill="url(#text_ugc_grad)">UGC Ads</tspan>
  </text>
</svg>
